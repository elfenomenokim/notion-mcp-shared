name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Installer supports macOS LaunchAgent and Linux systemd --user only; Windows is omitted.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check shell syntax and client configs
        shell: bash
        run: |
          # Upstream bundle builds (network/npm), live launchd/systemd installation,
          # and Notion API calls (require tokens) are left out of CI.
          bash -n install.sh notion-mcp-shared-server.sh build-notion-bundle.sh
          for file in clients/*.json; do
            python -m json.tool "$file" >/dev/null
          done
